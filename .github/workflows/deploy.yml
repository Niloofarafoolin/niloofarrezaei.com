# Builds the site and publishes it to GitHub Pages each time the main branch changes.
# The steps follow Astro's own guide: https://docs.astro.build/en/guides/deploy/github/
# Each action is fixed to an exact version, so that it cannot change without a change to this file.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets the owner run it by hand from the Actions tab on GitHub.
  workflow_dispatch:

# The job may read this repository and publish a Pages deployment. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install, build and upload the site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
